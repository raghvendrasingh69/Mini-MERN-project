<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fetch API with Search</title>
</head>
<body>

    <h1>Users List (Fetched Dynamically)</h1>

    <button onclick="fetchUsers()">Fetch Users</button>
    <br><br>

    <!--  Search Bar -->
    <input 
        type="text" 
        id="search" 
        placeholder="Search by name, email or city..."
        oninput="searchUsers()"
    >

    <br><br>

    <div id="output"></div>

    <script>
        let allUsers = []; // store API data globally

        async function fetchUsers() {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/users");
                allUsers = await response.json(); // save data
                displayUsers(allUsers); // show all users
            } catch (error) {
                console.log("Error fetching data:", error);
            }
        }

        
        function displayUsers(users) {
            const output = document.getElementById("output");
            output.innerHTML = "";

            users.forEach(user => {
                const div = document.createElement("div");
                div.style.border = "1px solid black";
                div.style.padding = "10px";
                div.style.margin = "10px 0";

                div.innerHTML = `
                    <strong>Name:</strong> ${user.name} <br>
                    <strong>Email:</strong> ${user.email} <br>
                    <strong>City:</strong> ${user.address.city}
                `;

                output.appendChild(div);
            });
        }

        // 🔍 Search logic
        function searchUsers() {
            const searchValue = document.getElementById("search").value.toLowerCase();

            const filteredUsers = allUsers.filter(user =>
                user.name.toLowerCase().includes(searchValue) ||
                user.email.toLowerCase().includes(searchValue) ||
                user.address.city.toLowerCase().includes(searchValue)
            );

            displayUsers(filteredUsers);
        }
    </script>

</body>
</html>
